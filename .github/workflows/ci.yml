name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests
        run: pytest --cov=dfir_pipeline --cov-report=term-missing

      - name: Run demo pipeline end-to-end
        run: python -m dfir_pipeline.cli --demo --output-dir ci_output

      - name: Upload demo report + visuals
        uses: actions/upload-artifact@v4
        with:
          name: demo-output-py${{ matrix.python-version }}
          path: ci_output/

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t dfir-correlation-pipeline:ci .
      - name: Smoke test container in demo mode
        run: docker run --rm -v ${{ github.workspace }}/ci_output:/app/output dfir-correlation-pipeline:ci --demo
