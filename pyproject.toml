[project]
name = "dfir-correlation-pipeline"
version = "0.1.0"
description = "Cross-source DFIR correlation: filesystem + memory (Volatility3) + log + network forensics merged into one IOC-matched master timeline"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["dfir_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 115
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
